name: Web and Android offline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --release --target wasm32-unknown-unknown --bin game-hub
      - run: python3 scripts/package-web.py
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-HUB-Web
          path: dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-HUB-Web-Offline
          path: dist/GAME-HUB-Offline.html
