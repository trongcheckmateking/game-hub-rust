name: Web and Android offline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --release --target wasm32-unknown-unknown --bin game-hub
      - run: python3 scripts/package-web.py
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-HUB-Web
          path: dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-HUB-Web-Offline
          path: dist/GAME-HUB-Offline.html
  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GAME-HUB-Web
          path: dist/web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK for testing and unsigned release bundle
        run: gradle -p android :app:assembleDebug :app:bundleRelease :app:assembleDebugAndroidTest
      - name: Verify release artifacts
        run: |
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          unzip -t "$bundle"
          unzip -Z1 "$bundle" | grep -Fx 'base/assets/game-hub.wasm'
          if unzip -Z1 "$bundle" | grep -E '^base/lib/.+\.so$'; then exit 1; fi
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "targetSdkVersion:'36'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -E 'android.permission.(INTERNET|CAMERA|RECORD_AUDIO|READ_CONTACTS|ACCESS_FINE_LOCATION)'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: GAME-HUB-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: gradle -p android :app:connectedDebugAndroidTest
